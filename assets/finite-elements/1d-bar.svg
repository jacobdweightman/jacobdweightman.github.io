<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270" role="img">
<title>A cylindrical bar fixed at the origin, stretched by a force F, with a ghost outline of its undeformed length</title>
<desc>Diagram of a one meter cylindrical bar fixed at x=0. A pale offset ghost cylinder shows the original undeformed length above the actual solid blue cylinder, which is stretched by elongation delta under an applied force F at its right end.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<linearGradient id="cylgrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#85B7EB"/>
<stop offset="50%" stop-color="#378ADD"/>
<stop offset="100%" stop-color="#185FA5"/>
</linearGradient>
</defs>
<style>
.t { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #2c2c2a; }
.ts { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #5f5e5a; }
.th { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 500; fill: #2c2c2a; }
</style>
<rect width="680" height="270" fill="#ffffff"/>

<!-- Box at left end -->
<polygon points="80,60 98,48 98,154 80,166" fill="#B4B2A9" stroke="#888780" stroke-width="0.5"></polygon>
<polygon points="80,60 60,60 78,48 98,48" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"></polygon>
<rect x="60" y="60" width="20" height="106" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"></rect>

<!-- 1D Rod -->
<polygon points="85,94 605,94 615,88 95,88" fill="#85B7EB" stroke="#888780" stroke-width="0.5"></polygon>
<polygon points="605,94 605,129 615,120 615,88" fill="#185FA5" stroke="#888780" stroke-width="0.5"></polygon>
<rect x="85" y="94" width="520" height="35" fill="#378ADD" stroke="#185FA5" stroke-width="0.5"/>

<!-- Plate at right end -->
<polygon points="605,70 605,150 615,140 615,60" fill="#B4B2A9" stroke="#888780" stroke-width="0.5"></polygon>
<polygon points="600,70 605,70 615,60 610,60" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"></polygon>
<rect x="600" y="70" width="5" height="80" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"></rect>

<!-- Displacement marker -->
<line x1="570" y1="102" x2="570" y2="180" stroke="#5f5e5a" stroke-width="0.5" stroke-dasharray="3 3" opacity="0.5"/>
<line x1="610" y1="156" x2="610" y2="180" stroke="#5f5e5a" stroke-width="0.5" stroke-dasharray="3 3" opacity="0.5"/>
<line x1="570" y1="180" x2="610" y2="180" stroke="#2c2c2a" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="ts" x="590" y="195" text-anchor="middle">u(1)</text>

<!-- Force marker -->
<line x1="610" y1="108" x2="655" y2="108" stroke="#D85A30" stroke-width="2" marker-end="url(#arrow)"/>
<text class="th" x="655" y="100" text-anchor="middle" fill="#712B13">F</text>

<!-- Axis -->
<line x1="60" y1="225" x2="655" y2="225" stroke="#2c2c2a" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="663" y="229">x</text>
<line x1="90" y1="220" x2="90" y2="230" stroke="#2c2c2a" stroke-width="0.5"/>
<text class="ts" x="90" y="243" text-anchor="middle">0 m</text>
<line x1="570" y1="220" x2="570" y2="230" stroke="#2c2c2a" stroke-width="0.5"/>
<text class="ts" x="570" y="243" text-anchor="middle">1 m</text>

<text class="ts" x="45" y="180" text-anchor="start">Fixed end</text>
<text class="ts" x="45" y="194" text-anchor="start">u(0) = 0</text>
</svg>
